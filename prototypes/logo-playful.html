<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadToMe · Say It Out Loud</title>
<style>
  :root { --paper:#f6f5f1; --cream:#fffdf6; --ink:#16161b; --muted:#74747c; --line:#e2dfd7; --coral:#f0563a; --yellow:#fff3b8; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:var(--paper); font:14px/1.55 ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",ui-sans-serif,system-ui,sans-serif; }
  main { width:min(1120px,calc(100% - 40px)); margin:auto; padding:52px 0 76px; }
  header { display:flex; align-items:end; justify-content:space-between; gap:30px; margin-bottom:30px; }
  .kicker { color:var(--coral); font-size:11px; font-weight:850; letter-spacing:.14em; text-transform:uppercase; }
  h1 { margin:7px 0 0; font-size:clamp(34px,5vw,54px); line-height:1; letter-spacing:-.05em; }
  header p { max-width:385px; margin:0; color:var(--muted); }
  .board { display:grid; grid-template-columns:1.6fr 1fr; grid-template-rows:350px 260px; gap:14px; }
  .tile { position:relative; overflow:hidden; border:1px solid var(--line); border-radius:22px; background:var(--cream); }
  .label { position:absolute; left:20px; bottom:17px; color:var(--muted); font:750 10px ui-sans-serif,system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
  .hero { display:grid; place-items:center; padding:42px; background:var(--yellow); }
  .hero img { width:min(520px,90%); transition:transform .25s cubic-bezier(.2,.8,.2,1.2); }
  .hero:hover img { transform:rotate(-1deg) scale(1.03); }
  .compact { display:grid; place-items:center; background:#e9e6de; }
  .compact img { width:156px; filter:drop-shadow(0 18px 24px rgba(22,22,27,.14)); }
  .dark { display:grid; place-items:center; background:var(--ink); }
  .dark img { width:330px; max-width:80%; filter:brightness(0) invert(1); }
  .dark::after { content:""; position:absolute; width:10px; height:10px; border-radius:50%; background:var(--coral); transform:translate(160px,27px); }
  .product { background:#fff; }
  .nav { height:68px; display:flex; align-items:center; padding:0 22px; border-bottom:1px solid var(--line); }
  .nav img { width:164px; }
  .links { margin-left:auto; display:flex; align-items:center; gap:21px; color:var(--muted); font:12px ui-sans-serif,system-ui,sans-serif; }
  .button { padding:8px 13px; color:#fff; background:var(--ink); border-radius:9px; font-weight:700; }
  .hello { padding:34px 26px 0; }
  .hello strong { display:block; font-size:25px; letter-spacing:-.04em; }
  .hello p { margin:5px 0 0; color:var(--muted); font:13px ui-sans-serif,system-ui,sans-serif; }
  .scale { display:flex; align-items:end; gap:25px; margin-top:20px; padding:22px 24px; border-block:1px solid var(--line); }
  .sample { display:grid; justify-items:center; gap:8px; color:var(--muted); font:10px ui-sans-serif,system-ui,sans-serif; }
  .sample:nth-child(1) img { width:24px; }
  .sample:nth-child(2) img { width:36px; }
  .sample:nth-child(3) img { width:54px; }
  .rationale { margin-left:auto; max-width:500px; color:var(--muted); font:12px ui-sans-serif,system-ui,sans-serif; }
  @media(max-width:760px) {
    header { flex-direction:column; align-items:start; }
    .board { grid-template-columns:1fr; grid-template-rows:270px 240px 210px 250px; }
    .links span { display:none; }
    .nav img { width:140px; }
    .dark::after { display:none; }
    .scale { flex-wrap:wrap; }
    .rationale { width:100%; max-width:none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <span class="kicker">Concept 06 · Say It Out Loud</span>
      <h1>像一句邀请，不像一个工具</h1>
    </div>
    <p>品牌名回到自然语言：圆润小写字母跟着朗读节奏轻轻跳动，`me` 下方只藏一个微笑，珊瑚感叹号负责留下记忆。</p>
  </header>

  <section class="board">
    <article class="tile hero">
      <img src="../public/brand/readtome-playful-wordmark.svg" alt="read to me!">
      <span class="label">Primary wordmark</span>
    </article>

    <article class="tile compact">
      <img src="../public/brand/readtome-me-mark.svg" alt="me! compact mark">
      <span class="label">Compact mark</span>
    </article>

    <article class="tile dark">
      <img src="../public/brand/readtome-playful-wordmark.svg" alt="read to me! reversed">
      <span class="label">One color</span>
    </article>

    <article class="tile product">
      <div class="nav">
        <img src="../public/brand/readtome-playful-wordmark.svg" alt="read to me!">
        <div class="links"><span>Reader</span><span>Features</span><span>Pricing</span><b class="button">Start reading</b></div>
      </div>
      <div class="hello">
        <strong>What do you want to hear?</strong>
        <p>导航栏真实尺寸与轻松的产品语气。</p>
      </div>
      <span class="label">In product</span>
    </article>
  </section>

  <section class="scale">
    <div class="sample"><img src="../public/brand/readtome-me-mark.svg" alt="">24</div>
    <div class="sample"><img src="../public/brand/readtome-me-mark.svg" alt="">36</div>
    <div class="sample"><img src="../public/brand/readtome-me-mark.svg" alt="">54</div>
    <p class="rationale">完整名称负责建立品牌认知；空间不足时使用 `me!`，保留“读给我听”最有人情味的部分。</p>
  </section>
</main>
</body>
</html>
