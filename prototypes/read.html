<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text to Speech Reader — Read To Me</title>
<meta name="description" content="Paste text or upload a document and listen with natural voices. Adjust language, playback speed and voice, and follow along with sentence highlighting.">
<link rel="stylesheet" href="styles.css">
</head>
<body data-title-key="meta.readTitle">

<nav class="nav">
  <div class="container nav-inner">
    <a class="brand" href="landing.html">
      <img class="brand-mark" src="../public/brand/readtome-pulse-mark.svg" alt="" width="40" height="30">
      <span class="brand-name">Read to me</span>
    </a>
    <div class="nav-links">
      <a href="landing.html" data-i18n="nav.home">Home</a>
      <a href="read.html" class="active" data-i18n="nav.reader">Reader</a>
      <a href="landing.html#features" data-i18n="nav.features">Features</a>
      <a href="landing.html#faq" data-i18n="nav.faq">FAQs</a>
      <a href="pricing.html" data-i18n="nav.pricing">Pricing</a>
      <span id="lang-switch"></span>
      <span id="auth-slot"></span>
    </div>
  </div>
</nav>

<main class="read-page">
  <div class="container">
    <div class="read-head">
      <h1 data-i18n="reader.heading">Reader</h1>
      <p data-i18n="reader.sub">Paste text, choose a voice, and follow along as it reads. Your text and position are remembered in this browser.</p>
    </div>
    <div id="reader-mount"></div>
  </div>
</main>

<script src="i18n.js"></script>
<script src="auth.js"></script>
<script src="reader.js"></script>
<script>
  var mount = document.getElementById('reader-mount');

  function boot() {
    RTMI18n.apply();
    RTM.mountReader(mount, { compact: false });
  }

  boot();
  RTMI18n.mountLangSwitch(document.getElementById('lang-switch'));
  RTMAuth.mountAuth(document.getElementById('auth-slot'));

  window.addEventListener('rtm:langchange', boot);
</script>
</body>
</html>
